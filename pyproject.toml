[project]
name = "safetool-pix"
version = "1.2.0"
description = "Privacy-first photo/video management desktop application"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.6.0",
    "PyQt6-Qt6>=6.6.0",
    "PyQt6-sip>=13.6.0",
    "Pillow>=10.0.0",
    "pillow-heif>=0.10.1",
    "imagehash>=4.3.1",
    "exifread>=3.0.0",
    "numpy>=1.24.3",
    "scipy>=1.10.1",
    "psutil>=5.9.5",
    "typing-extensions>=4.6.3",
    "opencv-python>=4.8.0",
    "send2trash>=1.8.0",
    "qtawesome>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-qt>=4.0.0",
    "pyinstaller>=6.16.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[tool.uv]
# uv will create .venv automatically when using `uv run`
managed = true
